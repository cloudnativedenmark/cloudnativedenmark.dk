name: Deploy Release to CloudFlare

on:
  push:
    branches:
      - "release-*"
  workflow_dispatch:
    inputs:
      release:
        description: "Release name, e.g. 2027. Creates release-<name> from main and serves it at <name>.cloudnativedenmark.dk."
        required: true
        type: string

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', inputs.release) || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      name: ${{ steps.release.outputs.name }}
      branch: ${{ steps.release.outputs.branch }}
      project: ${{ steps.release.outputs.project }}
      domain: ${{ steps.release.outputs.domain }}

    steps:
      - name: Require dispatch from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main, not $GITHUB_REF."
          exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Resolve release
        id: release
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            name="$RELEASE_INPUT"
          else
            name="${GITHUB_REF_NAME#release-}"
          fi
          node scripts/release-domain.mjs targets "$name" | tee -a "$GITHUB_OUTPUT"

      - name: Create release branch
        if: github.event_name == 'workflow_dispatch'
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::$BRANCH already exists. Push to it to redeploy."
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Created $BRANCH from main at $GITHUB_SHA"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ needs.prepare.outputs.branch }}
      url: https://${{ needs.prepare.outputs.domain }}/

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Yarn Berry
        run: corepack prepare yarn@4.9.1 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run TypeScript type checking
        run: yarn typecheck

      - name: Run ESLint
        run: yarn lint

      - name: Check code formatting
        run: yarn format

      - name: Run tests
        run: yarn test

      - name: Install Chromium for schedule PDF
        if: hashFiles('scripts/generate-schedule-pdf.mjs') != ''
        run: yarn playwright install --with-deps --only-shell chromium

      - name: Build website
        run: yarn build

      - name: Create Pages project (if needed)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ needs.prepare.outputs.project }} --production-branch=${{ needs.prepare.outputs.branch }}

      - name: Deploy to CloudFlare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ needs.prepare.outputs.project }} --branch=${{ needs.prepare.outputs.branch }}

      - name: Attach custom domain and DNS record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          RELEASE_NAME: ${{ needs.prepare.outputs.name }}
        run: node scripts/release-domain.mjs attach "$RELEASE_NAME"

      - name: Check the release site responds
        env:
          DOMAIN: ${{ needs.prepare.outputs.domain }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 20 --retry-delay 15 --retry-all-errors "https://$DOMAIN/"
          echo "Live at https://$DOMAIN/"
